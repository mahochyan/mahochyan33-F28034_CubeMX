name: R3.3 Peripheral Graph Static Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-test-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test runtime
        run: npm ci

      - name: Install legacy Python regression dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build official pin golden database
        run: python tools/build_official_pin_golden.py

      - name: Verify Python regressions
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Browser-core unit tests
        run: npm run test:unit

      - name: Build dist
        run: npm run build

      - name: Inspect dist
        run: npm run test:dist

      - name: R3.3 real browser acceptance
        run: npm run test:e2e

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
